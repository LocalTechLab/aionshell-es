name: Pruebas AionShell ES
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verificar sintaxis
        run: |
          python -m compileall -q aionshell-es.py scripts/preparar-modelos.py
          bash -n instalar-aionshell-es.sh
      - name: Pruebas unitarias sin red
        run: python -m unittest discover -s tests -v
